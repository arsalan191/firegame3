<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIREGAME SMP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #5c0000 0%, #180000 45%, #050505 100%);
    }

    .container {
      width: 900px;
      max-width: 92%;
      margin: 0 auto;
      padding: 40px 20px 60px;
      text-align: center;
    }

    .logo {
      width: 300px;
      max-width: 80%;
      display: block;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 20px #ff3c00);
    }

    h1 {
      margin: 10px 0;
      font-size: 32px;
      color: #fff;
      text-shadow: 0 0 15px #ff3c00;
    }

    .subtitle {
      color: #ddd;
      margin-bottom: 25px;
    }

    .server-info {
      display: inline-block;
      padding: 12px 25px;
      margin-bottom: 40px;
      border: 2px solid #ff4b00;
      border-radius: 12px;
      background: rgba(30, 0, 0, 0.7);
      box-shadow: 0 0 20px rgba(255, 60, 0, 0.35);
    }

    .ip {
      color: #ff7b00;
      font-weight: bold;
    }

    .version {
      color: #aaa;
      margin-top: 5px;
    }

    .box {
      padding: 20px;
      border: 2px solid #ff4b00;
      border-radius: 20px;
      background: rgba(10, 10, 10, 0.75);
      box-shadow: 0 0 30px rgba(255, 60, 0, 0.3);
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ff6a00;
      text-shadow: 0 0 10px #ff3c00;
    }

    .table {
      overflow: hidden;
      border: 1px solid #ff4b00;
      border-radius: 15px;
    }

    .header,
    .player {
      display: grid;
      grid-template-columns: 100px 1fr 150px;
      align-items: center;
    }

    .header {
      min-height: 58px;
      background: linear-gradient(90deg, #ff2600, #ff7100);
      font-weight: bold;
      font-size: 18px;
    }

    .player {
      min-height: 76px;
      border-top: 1px solid rgba(255, 75, 0, 0.35);
      background: rgba(25, 15, 15, 0.85);
      transition: 0.2s;
    }

    .player:hover {
      background: rgba(70, 20, 0, 0.8);
    }

    .player.first {
      background: rgba(70, 30, 0, 0.75);
    }

    .rank {
      font-size: 28px;
    }

    .player-name {
      font-size: 19px;
      font-weight: bold;
      direction: ltr;
    }

    .kills {
      font-size: 19px;
      color: #ff8a00;
      font-weight: bold;
    }

    .empty-message {
      padding: 30px 10px;
      color: #bbb;
      font-size: 20px;
      display: none;
    }

    .event-button {
      display: inline-block;
      margin-top: 30px;
      padding: 13px 28px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: linear-gradient(90deg, #ff2600, #ff7100);
      box-shadow: 0 0 20px rgba(255, 60, 0, 0.4);
      transition: 0.2s;
    }

    .event-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 80, 0, 0.7);
    }

    footer {
      margin-top: 50px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .header,
      .player {
        grid-template-columns: 70px 1fr 100px;
      }

      .header {
        font-size: 15px;
      }

      .player-name,
      .kills {
        font-size: 16px;
      }

      .logo {
        width: 230px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="fire.png" class="logo" alt="FIREGAME SMP">

    <h1>🔥 FIREGAME SMP</h1>

    <div class="subtitle">
      برترین بازیکنان FIREGAME SMP
    </div>

    <div class="server-info">
      <div>
        IP:
        <span class="ip">firegame12.aternos.me:61795</span>
      </div>

      <div class="version">
        Minecraft Java 1.21.4
      </div>
    </div>

    <div class="box">

      <div class="title">
        🏆 TOP KILL
      </div>

      <div class="table">

        <div class="header">
          <div>رتبه</div>
          <div>بازیکن</div>
          <div>Kill</div>
        </div>

        <div class="player first" id="row1">
          <span class="rank">🥇</span>
          <div class="player-name" id="player1"></div>
          <span class="kills" id="kills1"></span>
        </div>

        <div class="player" id="row2">
          <span class="rank">🥈</span>
          <div class="player-name" id="player2"></div>
          <span class="kills" id="kills2"></span>
        </div>

        <div class="player" id="row3">
          <span class="rank">🥉</span>
          <div class="player-name" id="player3"></div>
          <span class="kills" id="kills3"></span>
        </div>

        <div class="empty-message" id="emptyMessage">
          چیزی پیدا نشد 😗
        </div>

      </div>
    </div>

    <a href="event.html" class="event-button">
      🎉 ایونت‌ها
    </a>

    <footer>
      © 2026 FIREGAME SMP
    </footer>

  </div>

  <script>

    const API_URL = "https://apibahale12.onrender.com";

    async function loadKills() {

      const rows = [
        document.getElementById("row1"),
        document.getElementById("row2"),
        document.getElementById("row3")
      ];

      const emptyMessage =
        document.getElementById("emptyMessage");

      try {

        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("API Error: " + response.status);
        }

        const data = await response.json();

        const players =
          Array.isArray(data.kills)
            ? data.kills.slice(0, 3)
            : [];

        /* پاک کردن اطلاعات قبلی */

        for (let i = 1; i <= 3; i++) {

          document.getElementById("player" + i).textContent = "";
          document.getElementById("kills" + i).textContent = "";

        }

        /* اگر هیچ Kill وجود ندارد */

        if (players.length === 0) {

          rows.forEach(row => {
            row.style.display = "none";
          });

          emptyMessage.style.display = "block";

          return;
        }

        /* بازیکن‌ها وجود دارند */

        emptyMessage.style.display = "none";

        rows.forEach(row => {
          row.style.display = "grid";
        });

        players.forEach((player, index) => {

          const number = index + 1;

          const nameElement =
            document.getElementById("player" + number);

          const killsElement =
            document.getElementById("kills" + number);

          nameElement.textContent =
            player.name ?? "";

          killsElement.textContent =
            player.kills ?? 0;

        });

        /* ردیف‌های بدون بازیکن مخفی شوند */

        for (
          let i = players.length;
          i < 3;
          i++
        ) {

          rows[i].style.display = "none";

        }

      } catch (error) {

        console.error(
          "FIREGAME API ERROR:",
          error
        );

        rows.forEach(row => {
          row.style.display = "none";
        });

        emptyMessage.textContent =
          "چیزی پیدا نشد 😗";

        emptyMessage.style.display = "block";

      }

    }

    /* بارگذاری اولیه */

    loadKills();

    /* آپدیت هر 30 ثانیه */

    setInterval(loadKills, 30000);

  </script>

</body>
</html>
